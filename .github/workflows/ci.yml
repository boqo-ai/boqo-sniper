name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: npm test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ffmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # ffmpeg-full is keg-only and stays off PATH here, as in an agent's shell:
      # the engine's toolEnv() has to find it by itself (as in boqo-clips' CI).
      - name: Install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          # This runner's Homebrew links ffmpeg-full into /opt/homebrew/bin (boqo-clips CI, 2026-11-16).
          # Unlink it, as keg-only would leave it: only /opt/homebrew/opt/ffmpeg-full/bin stays.
          brew unlink ffmpeg-full
          ls /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg
          if ! command -v ffmpeg; then echo "no ffmpeg on PATH: the tests find ffmpeg-full only through toolEnv"
          elif ffmpeg -hide_banner -filters | grep -qE '^ *[^ ]+ +ass '; then echo "::warning::the ffmpeg on PATH has libass; the toolEnv check proves less"
          else echo "the ffmpeg on PATH has no libass: the libass tests pass only through toolEnv"; fi
      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y
      - run: npm ci --ignore-scripts
      - run: npm test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan the tree
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --no-banner --redact --exit-code 1
